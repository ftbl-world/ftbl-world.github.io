name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so the published site
# is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # react-scripts 4.0.0-next.98 pins TypeScript 3 against this project's
      # TypeScript 4, which npm refuses to resolve without this flag.
      - run: npm ci --legacy-peer-deps

      - run: npm run build
        env:
          # webpack 4 cannot use the default OpenSSL provider on Node 17+.
          NODE_OPTIONS: --openssl-legacy-provider
          # create-react-app turns lint warnings into build failures when CI is
          # set, which Actions does by default. Real compile errors still fail.
          CI: false

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
